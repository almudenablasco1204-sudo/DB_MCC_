{% extends "base.html" %}
{% block content %}

<style>
.contenedor {
    display: flex;
    height: 100vh;
}

/* IZQUIERDA */
.izquierda {
    flex: 1;
}

.izquierda img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* DERECHA */
.derecha {
    flex: 2;
    text-align: center;
    padding-top: 40px;
    position: relative;
}

/* 🔥 IMAGEN ESQUINA SUPERIOR DERECHA */
.img-top {
    position: absolute;
    top: 70px;
    right: 70px;
    width: 240px;
}

/* 🔥 BOTÓN VOLVER ESQUINA SUPERIOR IZQUIERDA */
.volver-top {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 16px;
    text-decoration: none;
    background: #2c7be5;
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
}

.volver-top:hover {
    background: #1a5edb;
}

h2 {
    font-size: 32px;
    margin-top: 60px;
}

form {
    margin-top: 20px;
}

label {
    display: block;
    margin: 10px;
    font-size: 18px;
}

input[name="valor"] {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    width: 250px;
    margin-top: 10px;
}

button {
    padding: 10px 25px;
    margin-top: 15px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background-color: #2c7be5;
    color: white;
    cursor: pointer;
}

button:hover {
    background-color: #1a5edb;
}

table {
    margin: 20px auto;
    border-collapse: collapse;
    width: 90%;
    font-size: 16px;
}

th, td {
    border: 1px solid #999;
    padding: 8px;
}

th {
    background-color: #f2f2f2;
}

</style>

<div class="contenedor">

    <!-- IZQUIERDA -->
    <div class="izquierda">
        <img src="{{ url_for('static', filename='buscar.jpeg') }}">
    </div>

    <!-- DERECHA -->
    <div class="derecha">

        <!-- 🔥 BOTÓN VOLVER ARRIBA -->
        <a href="/" class="volver-top">⬅ Volver</a>

        <!-- 🔥 IMAGEN ARRIBA DERECHA -->
        <img class="img-top" src="{{ url_for('static', filename='buscar.png') }}">

        <h2>Buscar Paciente</h2>

        <form method="post">

            <label><input type="radio" name="tipo" value="apellido" required> Apellido</label>
            <label><input type="radio" name="tipo" value="dni"> DNI</label>
            <label><input type="radio" name="tipo" value="hc"> Historia clínica</label>
            <label><input type="radio" name="tipo" value="anio"> Año nacimiento</label>

            <input name="valor" placeholder="Buscar">

            <br>
            <button type="submit">Buscar</button>

        </form>

        <hr>

        {% if resultados %}
            {{ resultados|safe }}
        {% endif %}

    </div>

</div>

{% endblock %}
