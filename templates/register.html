{% extends "base.html" %}
{% block content %}

<style>
.contenedor {
    display: flex;
    height: 100vh;
}

.izquierda, .derecha {
    flex: 1;
}

.izquierda img, .derecha img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.volver-top {
    position: absolute;
    top: 30px;
    left: 550px;
    font-size: 16px;
    text-decoration: none;
    background: #2c7be5;
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
}

.volver-top:hover {
    background: #1a5edb;
}
.centro {
    flex: 1.2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

form {
    width: 80%;
}

input {
    display: block;
    margin: 10px auto;
    padding: 10px;
    width: 100%;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background-color: #2c7be5;
    color: white;
    cursor: pointer;
}

button:hover {
    background-color: #1a5edb;
}

.mensaje {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
}
</style>

<div class="contenedor">

    <!-- IZQUIERDA -->
    <div class="izquierda">
        <img src="{{ url_for('static', filename='logo.jpeg') }}">
        <a href="/" class="volver-top">⬅ Volver</a>
    </div>
    
    <!-- CENTRO -->
    <div class="centro">

        <h2>Registrar Paciente</h2>

        <form method="post">

            <input name="hc" placeholder="Historia clínica" required>
            <input name="community" placeholder="Comunidad">
            <input name="dni" placeholder="DNI">
            <input name="last_name" placeholder="Apellido paterno" required>
            <input name="mother_last_name" placeholder="Apellido materno">
            <input name="first_name" placeholder="Nombre" required>
            <input type="date" name="birth_date">
            <input name="sex" placeholder="Sexo">
            <input name="phone" placeholder="Celular">

            <button type="submit">Guardar</button>

        </form>

        {% if mensaje %}
            <div class="mensaje">{{ mensaje }}</div>
        {% endif %}


    </div>

    <!-- DERECHA -->
    <div class="derecha">
        <img src="{{ url_for('static', filename='gif1.gif') }}">
    </div>

</div>

{% endblock %}
